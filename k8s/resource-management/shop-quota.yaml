apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-lab-quota
  namespace: shop
spec:
  hard:
    pods: "12"
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 5Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-container-limits
  namespace: shop
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 1Gi
