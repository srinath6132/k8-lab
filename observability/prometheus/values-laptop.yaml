# Optional kube-prometheus-stack profile for a single-node Minikube lab.
# Install only after stopping VM1; keep approximately 2 GiB free in VM2 for
# monitoring and stores Prometheus data ephemerally.
grafana:
  enabled: true
  adminPassword: "change-this-local-password"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

prometheus:
  enabled: true
  prometheusSpec:
    retention: 12h
    scrapeInterval: 30s
    evaluationInterval: 30s
    storageSpec: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 150m
      memory: 128Mi

prometheus-node-exporter:
  enabled: false
