apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: shop
    app.kubernetes.io/component: {{ .Values.component }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: shop
    app.kubernetes.io/component: {{ .Values.component }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
