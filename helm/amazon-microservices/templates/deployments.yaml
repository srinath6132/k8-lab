{{- $root := . -}}
{{- range $name, $config := .Values.services }}
{{- $jwtSecretName := default (printf "%s-jwt" $root.Release.Name) $root.Values.jwtSecretName -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $root.Release.Name $name }}
  labels:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{ if $root.Values.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ $root.Values.imagePullSecretName }}
      {{ end }}
      containers:
        - name: {{ $name }}
          image: {{ $config.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ $config.port }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            {{ if ne $name "product" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecretName }}
                  key: jwt-secret
            {{ end }}
            {{ if eq $name "auth" }}
            - name: USER_SERVICE_URL
              value: http://{{ $root.Release.Name }}-user:{{ $root.Values.services.user.port }}
            {{ end }}
            {{ if eq $name "cart" }}
            - name: PRODUCT_SERVICE_URL
              value: http://{{ $root.Release.Name }}-product:{{ $root.Values.services.product.port }}
            {{ end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $config.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
