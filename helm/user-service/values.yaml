fullnameOverride: shop-user
component: user
jwtSecretName: shop-jwt
image:
  repository: k8-lab-user-service
  tag: local
  pullPolicy: IfNotPresent
replicaCount: 1
containerPort: 8080
service:
  port: 8080
  type: ClusterIP
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SERVER_PORT
    value: "8080"
